name: Bug Report
description: File a bug report
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior
      description: What actually happened? Include exact error messages/text
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Screenshots, screen recordings, console logs, network tab, stack traces
      placeholder: Drag and drop images/videos here, or paste logs in a code block

  - type: dropdown
    id: reproducibility
    attributes:
      label: Reproducibility
      options:
        - "Always (100%)"
        - "Often (>50%)"
        - "Sometimes (<50%)"
        - "Rare / Once"
    validations:
      required: true

  - type: textarea
    id: regression
    attributes:
      label: Regression Info (if known)
      description: Did this before? If so, what's the last known working version/commit?
